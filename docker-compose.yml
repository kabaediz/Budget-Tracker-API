version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: budget-tracker-db
    environment:
      POSTGRES_DB: budgettracker
      POSTGRES_USER: budgetuser
      POSTGRES_PASSWORD: budgetpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetuser -d budgettracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget-tracker-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: budgettracker
      DB_USER: budgetuser
      DB_PASSWORD: budgetpass
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
